[project]
name = "risk-gated-mcp-gateway"
version = "0.1.0"
description = "Risk-gated MCP gateway: time-travel-safe research tools, trial logging, budgets and guarded orders for AI agents (Tradeq I9)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Alex Asadullin" }]
dependencies = [
    "fastapi==0.156.8",
    "httpx==0.28.1",
    "mcp==2.3.0",
    "pyarrow==26.0.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "structlog==26.1.0",
    "typer==0.27.3",
    "uvicorn==0.54.0",
]

[project.scripts]
gateway = "mcp_gateway.cli:app"

[dependency-groups]
dev = [
    "hypothesis==6.170.5",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "W", "C4", "PT", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pyarrow ships no type stubs; it is only used to decode Arrow IPC responses from I2.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q -m 'not live' --strict-markers"
markers = ["live: needs real downstream services (skipped by default)"]

[tool.coverage.run]
source = ["mcp_gateway"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
