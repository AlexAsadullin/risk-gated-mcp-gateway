# Risk-gated MCP Gateway (I9) defaults. Override any key with GATEWAY_<SECTION>__<KEY> env variables.
# Secrets (GATEWAY_ADMIN_API_KEY, GATEWAY_AGENT_API_KEY) and TRADEQ_DATA_DIR come from the environment only.

server:
  host: 127.0.0.1
  port: 8608
  mcp_path: /mcp
  admin_prefix: /admin/v1
  json_response: true
  stateless_http: false
  allowed_hosts: ["127.0.0.1:*", "localhost:*", "[::1]:*"]
  allowed_origins: ["http://127.0.0.1:*", "http://localhost:*", "http://[::1]:*"]
  log_level: INFO

auth:
  api_key_header: authorization
  bearer_scheme: bearer
  # Only honoured together with the admin key: lets an orchestrator (S8) act inside a given session.
  session_override_header: x-gateway-session
  api_key_bytes: 32

storage:
  subdir: risk-gated-mcp-gateway
  sessions_db: sessions.sqlite3
  audit_dir: audit
  audit_file_prefix: audit
  demo_dir: demo
  reports_dir: reports
  brokers_dir: brokers         # broker adapter state (mirror sandbox, T-Bank sandbox account map)

services:
  ledger: { base_url: "http://127.0.0.1:8601", timeout_s: 5.0 }
  pit: { base_url: "http://127.0.0.1:8603", timeout_s: 10.0 }
  forecast: { base_url: "http://127.0.0.1:8604", timeout_s: 30.0 }
  leakage: { base_url: "http://127.0.0.1:8605", timeout_s: 60.0 }
  backtest: { base_url: "http://127.0.0.1:8606", timeout_s: 120.0 }
  shadow: { base_url: "http://127.0.0.1:8610", timeout_s: 5.0 }
  # I7 has no assigned port yet; it implements the same Order API as I6 (contract 6.4).
  execution: { base_url: "http://127.0.0.1:8611", timeout_s: 5.0 }

ledger:
  source: i9
  inbox_relpath: research-ledger/inbox
  family_prefix: risk-gated-mcp-gateway
  # Family of backtest trials the gateway logs itself (refused or failed runs). It mirrors I5's
  # ledger.family_template, because S6 counts n_trials per family: a refused attempt must land in the family
  # of the I5 trials of the same strategy, or S6 would not count it.
  backtest_family_template: "i5/{strategy}/{universe}"
  # How agent-facing strategy names map to ledger strategy ids, so two agents never share a strategy.
  # No '/': S6 serves GET /v1/strategies/{strategy_id}/verdict, which cannot match an id containing a slash.
  strategy_id_template: "{agent_id}:{strategy}"
  periods_per_year: 8760.0

clock:
  allow_rewind: false
  allow_future: false

modes:
  live_enabled: false
  live_require_verdict: true
  live_require_clean_leakage: true

data:
  market_data_dataset_template: "tape.{channel}"
  # Features come from I2's feature store on a grid spine: one row per symbol every step.
  feature_entity_column: symbol
  feature_step_seconds: 3600
  channels: [trades, book_delta, book_snapshot, funding, liquidations, open_interest]
  max_rows: 500
  max_window_days: 366
  time_travel_policy: refuse

forecast:
  quantiles: [0.1, 0.5, 0.9]
  max_symbols: 20
  max_horizon: 168

backtest:
  fidelities: [vectorised, event, tick, reactive_sim]
  max_universe: 50

leakage:
  languages: [en]
  # Entities sent to S7 are the base asset of each normalised symbol (SBER-RUB-TQBR -> SBER).
  entity_separator: "-"
  default_window_days: 365
  flag_event_kind: llm_memorisation

budgets:
  defaults:                      # roubles (MOEX)
    capital: 5000000.0
    max_drawdown: 0.10
    max_order_notional: 1000000.0
    max_orders_per_window: 10
    order_window_s: 60.0
    max_tokens: 2000000
    max_token_cost_usd: 25.0
    max_latency_ms: 60000.0
    max_total_latency_ms: 3600000.0
  on_breach:
    capital: refuse
    order_notional: refuse
    order_rate: refuse
    drawdown: freeze
    tokens: freeze
    token_cost: freeze
    latency: freeze
    total_latency: freeze
  frozen_allowed_tools: [clock, budget, positions, account, verdict]

pricing:
  # USD per million tokens, Anthropic first-party API rates as checked on 2026-10-23 (see README, Configuration).
  # Claude Haiku 5.5 is priced for prompts up to 100K tokens ($0.50 / $2.50 beyond); the table has no tiers.
  # The default row prices models that are not listed; it is an assumption, not a published rate.
  default: { input_per_mtok_usd: 4.0, output_per_mtok_usd: 20.0 }
  models:
    claude-opus-5-5: { input_per_mtok_usd: 4.0, output_per_mtok_usd: 20.0 }
    claude-sonnet-5-5: { input_per_mtok_usd: 2.0, output_per_mtok_usd: 10.0 }
    claude-haiku-5-5: { input_per_mtok_usd: 0.10, output_per_mtok_usd: 0.50 }
    claude-sonnet-4-6: { input_per_mtok_usd: 3.0, output_per_mtok_usd: 15.0 }
    claude-haiku-4-5: { input_per_mtok_usd: 1.0, output_per_mtok_usd: 5.0 }
    # Not a real model: the deterministic test double that S8 and the tests drive.
    scripted-llm: { input_per_mtok_usd: 1.0, output_per_mtok_usd: 2.0 }
  unknown_model_policy: default

# MOEX only (spec revision 2026-10-29). Notional limits are in roubles.
risk:
  whitelist:
    - { venue: moex-tbank, symbol: SBER-RUB-TQBR }
    - { venue: moex-tbank, symbol: GAZP-RUB-TQBR }
    - { venue: moex-tbank, symbol: LKOH-RUB-TQBR }
  max_order_notional: 2000000.0
  max_position_notional: 4000000.0
  price_band_bps: 200.0          # fat-finger band around the last known trade
  require_reference_price: true
  require_instrument_rules: true  # refuse orders for instruments without lot/tick rules
  reference:
    channel: trades
    lookback_s: 3600.0
    price_column: price

orders:
  account_id_template: "agent-{agent_id}"
  default_time_in_force: GTC

# Contract 6.8: execution adapters. The gateway is not bound to an exchange; a new venue is a new adapter.
brokers:
  paper: mirror                  # paper sessions trade a copy of the real market by default
  live: execution                # I7 (contract 6.4); live is disabled in modes.live_enabled
  allowed_paper: [mirror, shadow, tbank-sandbox]
  instruments:                   # lot and tick from the MOEX securities table; checked live by I1 and T-Bank
    - { venue: moex-tbank, symbol: SBER-RUB-TQBR, lot_size: 1, tick: 0.01, currency: RUB, price_band_bps: 2000 }
    - { venue: moex-tbank, symbol: GAZP-RUB-TQBR, lot_size: 10, tick: 0.01, currency: RUB, price_band_bps: 2000 }
    - { venue: moex-tbank, symbol: LKOH-RUB-TQBR, lot_size: 1, tick: 0.5, currency: RUB, price_band_bps: 2000 }
  mirror:
    initial_cash: 10000000.0     # roubles per new account
    currency: RUB
    taker_fee_bps: 4.0           # broker plus exchange fee, a typical retail tariff
    maker_fee_bps: 4.0
    book_dataset: tape.book_snapshot
    trades_dataset: tape.trades
    book_lookback_s: 3600.0
    max_book_age_s: 600.0        # no book newer than this -> the order is rejected (no_market_data)
    state_file: mirror-state.json
  tbank_sandbox:
    base_url: "https://sandbox-invest-public-api.tbank.ru/rest/"
    service_prefix: tinkoff.public.invest.api.contract.v1
    token_env: TBANK_TOKEN
    timeout_s: 10.0
    initial_pay_in: 10000000.0
    currency: RUB
    state_file: tbank-sandbox-state.json

# In-process fakes of the downstream services (tests, make reproduce, make report). Synthetic, not market data.
fakes:
  seed: 7
  bar_seconds: 60
  knowledge_delay_s: 1
  cycle_amplitude: 0.02
  cycle_bars: 720
  noise_scale: 0.001
  base_prices: { SBER-RUB-TQBR: 285.0, GAZP-RUB-TQBR: 130.0, LKOH-RUB-TQBR: 6900.0 }
  book_levels: 5                 # fake I2 order book: levels per side, shares at level k = size * (k + 1)
  book_level_size: 1000.0
  book_ticks: { SBER-RUB-TQBR: 0.01, GAZP-RUB-TQBR: 0.01, LKOH-RUB-TQBR: 0.5 }
  initial_cash: 10000000.0
  currency: RUB
  flagged_models: [leaky-llm]
  verdict_min_sharpe: 1.0
  verdict_max_trials: 5

demo:
  agent_id: demo-agent
  venue: moex-tbank
  symbol: SBER-RUB-TQBR
  known_at: "2025-06-01T00:00:00Z"
  wall_clock: "2025-06-15T12:00:00Z"
  model: claude-sonnet-5-5
  report_seed: 20261021
  report_episodes: 200
  report_latency_calls: 300
  report_latency_repeats: 3
  report_bootstrap: 2000
